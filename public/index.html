<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cottontown" id="apptitle">
<meta name="theme-color" content="#ffffff">
<!-- No start_url in the manifest on purpose: an icon added to the Home Screen opens the page it was added from
     (a team's page goes straight to that team). -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Cottontown Coach</title>
<meta name="description" content="Game tracker, practice planner and drill library for Cottontown United coaches.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/features.css">
<link rel="stylesheet" href="css/polish.css">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" href="favicon.ico" sizes="48x48">
<!-- Link previews (texts, email): the club's logo and name instead of the host's. -->
<meta property="og:title" content="Cottontown Coach">
<meta property="og:description" content="Live scores, schedules and game tools for Cottontown United teams.">
<meta property="og:image" content="https://cottontown-coach.netlify.app/icons/icon-512.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<!-- The same app runs as the Beta site (any address with "beta" in it): it's labeled so testers know where they are. -->
<script>if(/(^|[.-])beta([.-]|$)/i.test(location.hostname)){document.documentElement.classList.add('beta');document.title='Cottontown Beta';}</script>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <span id="blogo"></span>
      <div><div class="t1" id="bname"></div><div class="t2" id="bsub"></div></div>
    </div>
    <button class="menubtn" id="menubtn" data-act="menu" aria-haspopup="dialog" aria-label="Menu"><span aria-hidden="true">⋯</span></button>
    <nav class="games" id="games" aria-label="Games"></nav>
    <div class="clockbox">
      <div class="clockface"><div class="sync" id="sync" hidden></div><div class="period" id="period"></div><div class="time" id="time">00:00</div></div>
      <div class="next" id="next"></div>
    </div>
    <div class="ctrl" id="ctrl"></div>
    <div class="adjrow" id="adjrow" hidden></div>
  </header>
  <div id="modesw"></div>
  <div id="score"></div>
  <div id="banner"></div>
  <main class="main">
    <section class="fieldcol">
      <div id="fmode"></div>
      <div class="pitchbox"><div class="pitch" id="pitch"></div></div>
      <div class="hint" id="hint"></div>
    </section>
    <section class="panel">
      <div id="score2"></div>
      <div class="tabs" role="tablist" id="tabs"></div>
      <div class="tbody" id="tbody"></div>
    </section>
  </main>
  <footer class="appfoot"><button class="fblink" data-install hidden>Add to Home Screen</button><button class="fblink" data-feedback>Send feedback</button></footer>
</div>
<div id="club" hidden></div>
<div id="sheet"></div>
<script src="js/teaminfo.js"></script>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>
<script src="js/drills.js"></script>
<script src="js/practice.js"></script>
<script src="js/voice.js"></script>
<script src="js/season.js"></script>
<script src="js/nav.js"></script>
<script src="js/events.js"></script>
<script src="js/addgame.js"></script>
<script src="js/formations.js"></script>
<script src="js/feedback.js"></script>
<script src="js/install.js"></script>
<script src="js/admin.js"></script>
<script src="js/home.js"></script>
<script src="js/main.js"></script>
</body>
</html>
