[build]
  publish = "public"
  functions = "netlify/functions"

[dev]
  publish = "public"
  port = 8888
  autoLaunch = false

# Page and scripts revalidate on each visit so coaches get updates; images and audio are cached.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
