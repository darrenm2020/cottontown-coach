[build]
  publish = "public"
  functions = "netlify/functions"

[dev]
  publish = "public"
  port = 8888
  autoLaunch = false

# Page and scripts revalidate on each visit so coaches get updates; images and audio are cached.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
# The app manifest needs its own file type for browsers to treat the site as installable.
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
